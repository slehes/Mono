name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install iOS platform if missing
        run: |
          # Check if iOS platform is available
          if ! xcodebuild -downloadPlatform iOS 2>/dev/null; then
            echo "Trying to install iOS platform..."
            xcodebuild -downloadPlatform iOS || true
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: MonoApp
        run: xcodegen generate

      - name: Resolve Swift Package Dependencies
        working-directory: MonoApp
        run: xcodebuild -resolvePackageDependencies -project Mono.xcodeproj -scheme Mono -clonedSourcePackagesDirPath SourcePackages

      - name: Build (unsigned, for generic iOS device)
        working-directory: MonoApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mono.xcodeproj \
            -scheme Mono \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_BITCODE=NO \
            STRIP_SWIFT_SYMBOLS=YES \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/build.log

      - name: Verify Mono binary exists
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Mono.app" -path "*/Build/Products/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Mono.app not found in DerivedData"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          # Check binary exists
          if [ ! -f "$APP_PATH/Mono" ]; then
            echo "ERROR: Mono binary not found in app bundle!"
            ls -la "$APP_PATH/"
            exit 1
          fi
          echo "Binary size: $(du -h "$APP_PATH/Mono" | cut -f1)"
          echo "App bundle size: $(du -sh "$APP_PATH" | cut -f1)"

      - name: Create Unsigned IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Mono.app" -path "*/Build/Products/Release-iphoneos/*" | head -1)
          
          # Create IPA structure
          IPA_DIR=$(mktemp -d)
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          
          # Create IPA
          cd "$IPA_DIR"
          zip -r "$RUNNER_TEMP/Mono.ipa" Payload/
          echo "IPA created at: $RUNNER_TEMP/Mono.ipa"
          ls -lh "$RUNNER_TEMP/Mono.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mono-Unsigned-IPA
          path: ${{ runner.temp }}/Mono.ipa
          retention-days: 30
