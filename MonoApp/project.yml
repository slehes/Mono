name: Mono
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.9.0

targets:
  Mono:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mono
    dependencies:
      - package: Alamofire
        product: Alamofire
    info:
      path: Mono/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mono.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Mono/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
